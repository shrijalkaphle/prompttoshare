<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">

     <link rel="stylesheet" href="static/fonts/icomoon/style.css">

    <link rel="stylesheet" href="static/style.css">

    <title>Console AI</title>
  </head>
  <body>



<div class="row text-white">
      

    <div class="col-12">
        <form class="form" method="POST" action="/generate_img" id="myForm">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
          <div class="mb-3">
            <label for="prompt" class="form-label">Enter prompt to generate image</label>
            <input type="text" class="form-control" id="prompt" name="prompt" required="required">
          </div>
   
          <button id="submitbtn" type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
</div>


<div class="container">
    <h1 class="mt-4 mb-4">Image Gallery</h1>
    
    <div class="row">
      <div class="col-md-4 my-2">
        <div class="card mb-4">
          <img src="{{img}}" class="card-img-top" alt="generate-image">

           <div class="card-body">
            <form method="POST" action="/save_image">
               <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
              <input type="hidden" name="url" value="{{ img }}">
              <button type="submit" class="btn btn-primary">Save</button>
            </form>
          </div>
  
        </div>
      </div>
    

    </div>
    

    <h1 class="mt-4 mb-4">Saved Image Gallery</h1>
    
    <div class="row">
        {% for image in images %}
        <div class="col-md-4 my-2">
            <div class="card mb-4">
                <img src="{{ image.url }}" class="card-img-top" alt="saved-image">
            </div>
        </div>
        {% endfor %}
    </div>

  
  </div>


    <!-- Optional JavaScript; choose one of the two! -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js" integrity="sha512-pumBsjNRGGqkPzKHndZMaAG+bir374sORyzM3uulLV14lN5LyykqNk8eEeUlUkB3U0M4FApyaHraT65ihJhDpQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

 

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    
     <script src="static/script.js"></script>

  </body>
</html>
