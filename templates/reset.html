<body style="background: radial-gradient(circle, rgba(24,32,39,1) 33%, rgba(36,25,40,1) 54%);">

  <div>Prompt2Share</div>
  <div >
        
                {% if mesage is defined and mesage %}
            <div class="alert alert-warning">{{ mesage }}</div>
          {% endif %}

        <div class="col-6 register">

               <form method="POST">

  

            <div class="register-form">

              <div class="text-center pb-3 text-white">
                  <h2>Reset your passsword here</h2>
              </div>

              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                  <div class="form-group log-status">
                 <input type="password" name="password" class="form-control" placeholder="Password" id="password">
           
               </div>


               <div class="form-group log-status">
                 <input type="password" name="c_password" class="form-control" placeholder="Confirm Password" id="password">
       
               </div>
               <button type="submit" class="log-btn" ><i class="mdi mdi-account"></i> Reset </button>


             </div>
           </form>


        </div>

      </div>
