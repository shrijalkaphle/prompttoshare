<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Counseling</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">

     <link rel="stylesheet" href="static/fonts/icomoon/style.css">

    <link rel="stylesheet" href="static/style.css">
</head>
<body>


<div class="row justify-content-center mt-5">
  <div class="col-10">
  <form method="POST" action="{{url_for('payment')}}">
      <input id="user_id" type="hidden" name="user_id" value="{{ session['user_id'] }}">
      <input id="payment" type="hidden" name="payment" value="Paid">
      <input id="name" name="name" value="{{current_user['name']}}" placeholder="Enter your Name">
      <input id="email" name="email" value="{{session['email']}}" placeholder="Enter your Email">
                                  
        
                    <div id="paypal-button-container"></div>
                    
                    </form> 
              </div>
            </div>


    <!-- Optional JavaScript; choose one of the two! -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js" integrity="sha512-pumBsjNRGGqkPzKHndZMaAG+bir374sORyzM3uulLV14lN5LyykqNk8eEeUlUkB3U0M4FApyaHraT65ihJhDpQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <script src="static/script.js"></script>

    <script src="https://www.paypal.com/sdk/js?client-id=AZ72DajF1i4-L9IHk63FGK-rYylLJrQktOJtZ-b4Kpp_aPQsSNxAkMNxqgMYrv8jd_TLrdd62JUx2CnG&currency=USD"></script>

    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>



   <script type="text/javascript">
paypal.Buttons({

// Sets up the transaction when a payment button is clicked
    createOrder: function(data, actions) {
        return actions.order.create({
        purchase_units: [{
        amount: {
            value: '1'
        },


        }]
        });
    },

    // Finalize the transaction after payer approval
    onApprove: function(data, actions) {
    return actions.order.capture().then(function(orderData) {
    
        var transaction = orderData.purchase_units[0].payments.captures[0];

        var name = document.getElementById("name").value;
        var email = document.getElementById("email").value;
        var user_id = document.getElementById("user_id").value;
        var payment = document.getElementById("payment").value;

        var csrf_token = "{{ csrf_token() }}";

    $.ajaxSetup({
        beforeSend: function(xhr, settings) {
            if (!/^(GET|HEAD|OPTIONS|TRACE)$/i.test(settings.type) && !this.crossDomain) {
                xhr.setRequestHeader("X-CSRFToken", csrf_token);
            }
        }
    });

            $.ajax({
            url: "/payment",
            method: "POST",
            data: {
                name: $('#name').val(),
                email: $('#email').val(),
                user_id: $('#user_id').val(),
                payment: $('#payment').val(),


            },
            success: function (response) {
  
            swal('', response.status, 'success')
                .then((value) => {
                    window.location.href = '/login';
                });
               
            }
        }); 
  
    });
    }
    }).render('#paypal-button-container');



</script>

    
  </body>
</html>
